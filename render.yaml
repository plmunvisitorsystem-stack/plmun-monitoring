# Render Blueprint (free plan): one web service = website + API + live chat.
# Render -> New -> Blueprint -> this repository. Values marked "sync: false" are
# secrets: Render asks for them and they are never stored in this file.
# JWT_SECRET is generated by Render (a long random value) and never shown here.
# Photos go to Cloudinary (CLOUDINARY_URL) because Render's free disk is wiped on restart.
# Steps: DEPLOY.md
services:
  - type: web
    name: landayan-ers
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_ORIGIN
        sync: false # the service address, e.g. https://landayan-ers.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: landayan_ers
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false # the whole ca.pem text from the Aiven service page
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: CLOUDINARY_URL
        sync: false # cloudinary://<api_key>:<api_secret>@<cloud_name>
