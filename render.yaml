# Render Blueprint: one free web service that serves the website, the API,
# and live chat (Socket.IO) from the same address.
# Render -> New -> Blueprint -> pick this repository. Secret values (sync: false)
# are typed in when Render asks for them; they are never stored in this file.
# Full steps: DEPLOY.md
services:
  - type: web
    name: landayan-reporting
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_CLIENT
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://landayan-reporting.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: landayan_ers
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false # the CA certificate from the Aiven service page (PEM text)
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: CLOUDINARY_URL
        sync: false # cloudinary://<api_key>:<api_secret>@<cloud_name>
