<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Gate Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b1120; background-image: radial-gradient(circle at top right, #1e3a8a 0%, transparent 40%), radial-gradient(circle at bottom left, #0f766e 0%, transparent 40%); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
        .terminal-card { background: #111827; width: 100%; max-width: 500px; padding: 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; border: 1px solid #1f2937; position: relative; overflow: hidden; }
        .terminal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        h2 { color: #ffffff; font-weight: 700; }
        p { color: #9ca3af; font-size: 14px; }
        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 3px solid #374151; margin-bottom: 20px; display: none; }
        .status-area { padding: 25px 20px; border-radius: 20px; display: none; margin-bottom: 20px; }
        .status-title { font-size: 36px; font-weight: 800; margin-bottom: 5px; }
        .status-name { font-size: 18px; font-weight: 600; opacity: 0.9; }
        .bg-in { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 2px solid rgba(16, 185, 129, 0.3); }
        .bg-out { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 2px solid rgba(59, 130, 246, 0.3); }
        .bg-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 2px solid rgba(239, 68, 68, 0.3); }
        .btn-custom { background: #1e3a8a; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 600; width: 100%; margin-bottom: 10px; }
        .btn-outline-custom { border: 2px solid #374151; color: #9ca3af; padding: 12px; border-radius: 12px; font-weight: 600; width: 100%; background: transparent; }
        .scan-hint { display: none; color: #10b981; font-size: 13px; font-weight: 600; margin-top: 10px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    </style>
</head>
<body>

<div class="terminal-card">
    <div class="mb-4 mt-2">
        <h2>Gate Terminal</h2>
        <p>Position the QR code within the frame.</p>
    </div>
    
    <div id="reader"></div>
    <div id="statusBox" class="status-area"></div>
    <div id="scanHint" class="scan-hint">● SCANNING</div>
    
    <div id="controls">
        <button id="startBtn" class="btn-custom" onclick="startCamera()">📷 Start Camera</button>
        <button id="stopBtn" class="btn-outline-custom" onclick="stopCamera()" style="display: none;">⏹️ Stop Camera</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvEt5YujwsC5iZGiBUNrCvcsy0IUIztUk",
        authDomain: "plmun-system-v2.firebaseapp.com",
        projectId: "plmun-system-v2",
        storageBucket: "plmun-system-v2.firebasestorage.app",
        messagingSenderId: "348432254532",
        appId: "1:348432254532:web:5b1b138997f77a59ccb1e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusBox = document.getElementById('statusBox');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const readerDiv = document.getElementById('reader');
    const scanHint = document.getElementById('scanHint');

    let html5QrCode = null;
    let isProcessing = false;
    let lastScannedCode = '';
    let lastScanTime = 0;
    const COOLDOWN_MS = 1000;

    window.startCamera = async function() {
        if (html5QrCode) { try { await html5QrCode.stop(); } catch (e) {} html5QrCode = null; }
        readerDiv.innerHTML = '';
        readerDiv.style.display = 'block';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        statusBox.style.display = 'none';
        scanHint.style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        try { await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanError); } 
        catch (err) { alert("Camera Error: " + err); window.stopCamera(); }
    };

    window.stopCamera = async function() {
        if (html5QrCode) { try { await html5QrCode.stop(); } catch (err) {} html5QrCode = null; }
        readerDiv.style.display = 'none';
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        scanHint.style.display = 'none';
    };

    function playSound(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'success') { osc.frequency.value = 880; } if (type === 'error') { osc.frequency.value = 200; } 
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5); osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
    }

    async function onScanSuccess(decodedText, decodedResult) {
        const now = Date.now();
        if (isProcessing || (decodedText === lastScannedCode && now - lastScanTime < COOLDOWN_MS)) return; 

        isProcessing = true;
        lastScannedCode = decodedText;
        lastScanTime = now;
        scanHint.style.display = 'none';
        statusBox.style.display = 'block'; 
        statusBox.className = 'status-area bg-in'; 
        statusBox.innerHTML = '<h4 class="m-0" style="color: #9ca3af;">Processing...</h4>';
        
        try {
            let userData = null;
            let userId = null;
            let isVisitor = false;

            // 1. HANAPIN SA USERS (Student, Faculty, Admin, Guard)
            let usersRef = collection(db, "users");
            let q = query(usersRef, where("qrString", "==", decodedText));
            let querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                userData = querySnapshot.docs[0].data();
                userId = querySnapshot.docs[0].id;
            } else {
                // 2. KUNG WALA SA USERS, HANAPIN SA VISITORS
                let visitorsRef = collection(db, "visitors");
                q = query(visitorsRef, where("qrString", "==", decodedText));
                querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    userData = querySnapshot.docs[0].data();
                    userId = querySnapshot.docs[0].id;
                    isVisitor = true;
                } else {
                    throw new Error("Invalid QR Code.");
                }
            }

            // 3. CHECK EXPIRATION KUNG VISITOR
            if (isVisitor && userData.expiresAt && userData.expiresAt.toMillis() < now) {
                throw new Error("Visitor Pass Expired.");
            }

            // 4. DETERMINE ACTION (IN/OUT)
            const today = new Date(); today.setHours(0,0,0,0);
            const logsRef = collection(db, "logs");
            const logQuery = query(logsRef, where("userId", "==", userId), where("timestamp", ">=", Timestamp.fromDate(today)));
            const logSnapshot = await getDocs(logQuery);

            let action = "IN";
            if (!logSnapshot.empty) {
                const existingLog = logSnapshot.docs[logSnapshot.size - 1].data();
                if (existingLog.action === "IN") { action = "OUT"; } 
                else { throw new Error("Already checked out today."); }
            }

            // 5. SAVE LOG
            await addDoc(collection(db, "logs"), {
                userId: userId,
                fullName: userData.fullName,
                action: action,
                timestamp: Timestamp.now(),
                gate: isVisitor ? "Visitor Gate" : "Main Gate"
            });

            playSound('success');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            if (action === 'IN') {
                statusBox.className = 'status-area bg-in';
                statusBox.innerHTML = `<div class="status-title">IN</div><div class="status-name">${userData.fullName} ${isVisitor ? '(Visitor)' : ''}</div>`;
            } else {
                statusBox.className = 'status-area bg-out';
                statusBox.innerHTML = `<div class="status-title">OUT</div><div class="status-name">${userData.fullName} ${isVisitor ? '(Visitor)' : ''}</div>`;
            }

        } catch (error) {
            playSound('error');
            if (navigator.vibrate) navigator.vibrate(300);
            statusBox.className = 'status-area bg-error';
            statusBox.innerHTML = `<div class="status-title" style="font-size: 24px;">DENIED</div><div class="status-name" style="font-size:14px;">${error.message}</div>`;
        }

        setTimeout(() => { 
            statusBox.style.display = 'none'; 
            isProcessing = false;
            scanHint.style.display = 'block';
        }, COOLDOWN_MS);
    }

    function onScanError(errorMessage) { /* Ignore */ }
</script>
</body>
</html>
