<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* ... (same CSS as before) ... */
        body { font-family: 'Poppins', sans-serif; background-color: #0b1120; color: #e5e7eb; margin: 0; }
        .main-content { padding: 30px 40px; }
        .content-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 25px; }
        .table-custom { width: 100%; color: white; border-collapse: separate; border-spacing: 0 10px; }
        .table-custom thead th { color: #9ca3af; font-size: 13px; padding: 10px 15px; border-bottom: 2px solid #1f2937; text-transform: uppercase; }
        .table-custom tbody td { padding: 15px; background: #1f2937; color: white; border: none; }
        .table-custom tbody tr td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        .table-custom tbody tr td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        .badge-in { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 5px 12px; border-radius: 50px; font-size: 12px; }
        .badge-out { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 5px 12px; border-radius: 50px; font-size: 12px; }
        .stat-card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .stat-info h6 { color: #9ca3af; font-size: 13px; }
        .stat-info h3 { color: white; font-weight: 700; margin: 0; }
        .welcome-banner { background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%); border-radius: 20px; padding: 40px; margin-bottom: 30px; }
        .welcome-banner h1 { color: white; font-weight: 700; }
        .welcome-banner p { color: rgba(255,255,255,0.7); }
        .form-control { background: #1f2937; border: 1px solid #374151; color: white; }
        .form-control:focus { background: #1f2937; color: white; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="welcome-banner">
        <h1>Welcome back, Admin!</h1>
        <p>Monitor real-time campus entry and exit logs.</p>
    </div>

    <!-- Stats Cards (same as before) -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-box-arrow-in-down"></i></div><div class="stat-info"><h6>Total Check IN</h6><h3 id="statIn">0</h3></div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-box-arrow-up"></i></div><div class="stat-info"><h6>Total Check OUT</h6><h3 id="statOut">0</h3></div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-building"></i></div><div class="stat-info"><h6>Currently Inside</h6><h3 id="statInside">0</h3></div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-people"></i></div><div class="stat-info"><h6>Total Users</h6><h3 id="statUsers">0</h3></div></div></div>
    </div>

    <div class="content-card">
        <!-- DATE FILTER & EXPORT -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h5 class="text-white fw-bold mb-0">Attendance Logs</h5>
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <input type="date" id="startDate" class="form-control" style="width: auto;">
                <span class="text-white-50">to</span>
                <input type="date" id="endDate" class="form-control" style="width: auto;">
                <button class="btn btn-primary btn-sm" onclick="filterByDate()">Filter</button>
                <button class="btn btn-success btn-sm" onclick="exportToCSV()">📥 Export CSV</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table-custom">
                <thead><tr><th>Name</th><th>Action</th><th>Gate</th><th>Date & Time</th></tr></thead>
                <tbody id="recentLogsTable"><tr><td colspan="4" class="text-center py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, limit, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvEt5YujwsC5iZGiBUNrCvcsy0IUIztUk",
        authDomain: "plmun-system-v2.firebaseapp.com",
        projectId: "plmun-system-v2",
        storageBucket: "plmun-system-v2.firebasestorage.app",
        messagingSenderId: "348432254532",
        appId: "1:348432254532:web:5b1b138997f77a59ccb1e1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allLogs = [];

    function formatDate(timestamp) {
        if (!timestamp) return "N/A";
        const date = timestamp.toDate();
        return date.toLocaleString('en-PH', { timeZone: 'Asia/Manila', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
    }

    async function fetchDashboardData() {
        try {
            const usersSnapshot = await getDocs(collection(db, "users"));
            const visitorsSnapshot = await getDocs(collection(db, "visitors"));
            document.getElementById('statUsers').innerText = usersSnapshot.size + visitorsSnapshot.size;

            const logsRef = collection(db, "logs");
            const qRecent = query(logsRef, orderBy("timestamp", "desc"), limit(100));
            const recentSnapshot = await getDocs(qRecent);

            allLogs = [];
            let totalIn = 0, totalOut = 0;
            const insideUsers = new Set();

            recentSnapshot.forEach((doc) => {
                const data = doc.data();
                allLogs.push({
                    name: data.fullName,
                    action: data.action,
                    gate: data.gate || "Main Gate",
                    time: formatDate(data.timestamp)
                });
                if (data.action === 'IN') totalIn++;
                if (data.action === 'OUT') totalOut++;
            });

            // Compute currently inside
            const sortedLogs = [...allLogs].reverse();
            sortedLogs.forEach(log => {
                if (log.action === 'IN') insideUsers.add(log.name);
                if (log.action === 'OUT') insideUsers.delete(log.name);
            });

            document.getElementById('statIn').innerText = totalIn;
            document.getElementById('statOut').innerText = totalOut;
            document.getElementById('statInside').innerText = insideUsers.size;
            renderTable(allLogs);

        } catch (error) { console.error(error); }
    }

    function renderTable(logs) {
        const tbody = document.getElementById('recentLogsTable');
        tbody.innerHTML = '';
        if (!logs || logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">No records found.</td></tr>';
            return;
        }
        logs.forEach(log => {
            const badge = log.action === 'IN' ? '<span class="badge-in">IN</span>' : '<span class="badge-out">OUT</span>';
            tbody.innerHTML += `<tr><td class="fw-bold">${log.name}</td><td>${badge}</td><td class="text-white-50">${log.gate}</td><td class="text-white-50">${log.time}</td></tr>`;
        });
    }

    window.filterByDate = async function() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        if (!startDate || !endDate) { alert("Select both dates."); return; }

        const start = new Date(startDate + 'T00:00:00+08:00');
        const end = new Date(endDate + 'T23:59:59+08:00');

        const logsRef = collection(db, "logs");
        const q = query(logsRef, where("timestamp", ">=", Timestamp.fromDate(start)), where("timestamp", "<=", Timestamp.fromDate(end)), orderBy("timestamp", "desc"));

        try {
            const snapshot = await getDocs(q);
            allLogs = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                allLogs.push({ name: data.fullName, action: data.action, gate: data.gate, time: formatDate(data.timestamp) });
            });
            renderTable(allLogs);
        } catch (e) { alert("Filter failed: " + e.message); }
    }

    window.exportToCSV = function() {
        if (allLogs.length === 0) { alert("No data."); return; }
        let csv = "Name,Action,Gate,Date & Time\n";
        allLogs.forEach(log => { csv += `"${log.name}","${log.action}","${log.gate}","${log.time}"\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'PLMun_Attendance.csv'; a.click();
        window.URL.revokeObjectURL(url);
    }

    fetchDashboardData();
</script>
</body>
</html>
